name: Regenerate package lockfile

on:
  push:
    branches:
      - feat/mplace-id-unification

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mplace-id-unification
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/regenerate-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/regenerate-lockfile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh package lockfile"
          git push origin HEAD:feat/mplace-id-unification
